# One line per environment variable the package reads. The generator fails when the
# code reads a variable missing here, or this file names one the code no longer reads.
ACQUISITION_INDEX_DIR: Directory holding each jurisdiction's built acquisition index, as `<dir>/<jurisdiction>/index.json`.
ACQUISITION_USER_AGENT: User-Agent every acquisition and URL-ingest request carries, naming you and a contact; unset, those requests stop with an error.
AZURE_FOUNDRY_OCR_RPM: Requests per minute allowed to the direct Azure OCR endpoint in `ingest-one`.
AZURE_OPENAI_API_KEY: Key for the direct Azure OCR endpoint; with `AZURE_OPENAI_ENDPOINT` set, `ingest-one` can route transcription there.
AZURE_OPENAI_ENDPOINT: Azure endpoint whose host `ingest-one` uses to build the direct OCR address; needs `AZURE_OPENAI_API_KEY` as well.
CODIFY_DATA_ROOT: Absolute path to a directory holding the `data/` folders (such as `jurisdictions`) in place of the ones found beside the package.
CODIFY_RELEASE: Release name attached to traces.
CODIFY_TEST_RUN_ID: Pins the identifier the test helpers use to name per-run databases; set automatically outside pytest-xdist.
CODIFY_TEST_SHARE_DB: Set to `1` to make pytest-xdist workers share the base test database instead of each cloning their own.
EE_DATADUMP_ZIP: Path to the bulk XML archive the `ee` datadump acquirer reads when none is passed in code.
EMBEDDING_API_KEY: Key for the embeddings endpoint; falls back to `LLM_API_KEY`.
EMBEDDING_BASE_URL: OpenAI-compatible embeddings endpoint for `load --embed`, `search`, the HTTP server and the MCP server; falls back to `LLM_BASE_URL`.
EMBEDDING_MODEL: Embedding model name sent to the embeddings endpoint.
ENVIRONMENT: Deployment name; unless it is empty, `localhost` or `development`, an unset `POSTGRES_URL` is an error instead of falling back to the local database.
EU_DATADUMP_ZIP: Path to the bulk FORMEX archive the EU acquirer reads when none is passed in code.
LANGFUSE_PUBLIC_KEY: Langfuse tracing key; when it is unset the CLI silences the Langfuse SDK's warnings.
LLM_API_KEY: Key for the chat endpoint at `LLM_BASE_URL`.
LLM_BASE_URL: OpenAI-compatible chat endpoint used by `ingest-one`, `compare` and the servers; `ingest-one` stops with an error when it is unset.
LLM_CONTENT_FILTER_FALLBACK_MODEL: Default for `ingest-one --fallback-model`, the model retried when a call is refused by a content filter.
LLM_MODEL: Default chat model for `ingest-one --model`, `compare` and the servers.
LLM_OCR_MODEL: Default for `ingest-one --ocr-model`, the transcription engine; empty uses the vision route on the chat model.
OLLAMA_HOST: Address of a local Ollama server for the test helpers.
POSTGRES_URL: Database connection URL; unset, the local compose database, but only where `ENVIRONMENT` is local or development.
PYTEST_XDIST_TESTRUNUID: Set by pytest-xdist; the test helpers use it to name one database per test run.
PYTEST_XDIST_WORKER: Set by pytest-xdist; the test helpers give each worker its own database.
QBZ_AUTH: Authorisation value the `al` QBZ acquirer sends with every request, in place of its built-in public token.
SSL_CERT_DIR: Directory of CA certificates the polite HTTP client trusts, read when `SSL_CERT_FILE` is unset.
SSL_CERT_FILE: CA bundle the polite HTTP client trusts in place of the bundled certificates.
