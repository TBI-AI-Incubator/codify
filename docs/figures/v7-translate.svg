<text x="12" y="88">English source</text>
<text x="12" y="104" class="code">/akn/xa/act/1992/7/eng@2012-01-01</text>
<text x="12" y="128">1 Short title and commencement</text>
<text x="12" y="148" class="note">(1) This Act may be cited as the</text>
