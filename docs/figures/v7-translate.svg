<svg xmlns="http://www.w3.org/2000/svg" width="624" height="260" viewBox="0 0 624 260" role="img" aria-label="One eId, part_I__sec_1, names section 1 of the Legislation Act, 1992 in English and in a French text marked as not authoritative; the French was written by hand for the example.">
