<svg xmlns="http://www.w3.org/2000/svg" width="358" height="729" viewBox="0 0 358 729" role="img" aria-label="The repair loop: a check with no permitted operation is skipped; otherwise a plan of typed operations passes six guards on a copy, a rejected model plan is revised up to 3 times, and a low or medium risk plan is applied while a high risk plan, which includes any body written with no page evidence, is queued for approval.">
<style>
svg{color:#1d1d1d;font-family:'Geist Sans',ui-sans-serif,system-ui,sans-serif;fill:none;stroke:none}
.s{stroke:currentColor;stroke-width:1.5}.s2{stroke:#6b6b6b;stroke-width:1}.dash{stroke-dasharray:3 3}:not(text).em{stroke:currentColor;stroke-width:2.5}
.box{fill:#fff}.box-lo{fill:#f5f5f5}.ink{fill:currentColor}
text{fill:currentColor;font-size:13px;font-weight:500;letter-spacing:-0.01em}
text.note{fill:#3e3e3e;font-size:12px;font-weight:400;letter-spacing:0}
text.code{fill:#3e3e3e;font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;font-weight:400;letter-spacing:0}
text.micro{fill:#3e3e3e;font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;font-weight:400;letter-spacing:.06em;text-transform:uppercase}
text.em{font-weight:600}
@media (prefers-color-scheme:dark){svg{color:#f3f4ef}.s2{stroke:#a5afa8}.box{fill:#131615}.box-lo{fill:#1c211f}text.note,text.code,text.micro{fill:#c7cdc9}}
</style>
<defs><marker id="arrow" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 8 4.5 1 8" class="s" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="arrow2" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 8 4.5 1 8" class="s2" stroke-linejoin="round" stroke-linecap="round"/></marker></defs>
<rect x="259" y="7" width="7" height="7" class="ink"/>
<text x="270" y="14" class="note">calls a model</text>
<rect x="0" y="32" width="358" height="120" rx="3" class="s box"/>
<text x="12" y="49">Repair permitted?</text>
<text x="12" y="64" class="note">The check must allow an operation</text>
<path d="M12 76 L346 76" class="s2"/>
<text x="12" y="92" class="micro">If no: skipped</text>
<text x="12" y="108" class="code">skipped_non_actionable</text>
<text x="12" y="124" class="note">The worked example stops here:</text>
<text x="12" y="140" class="note">fix the config, ingest again</text>
<path d="M40 152 L40 174" class="s" marker-end="url(#arrow)"/>
<text x="50" y="168" class="note">yes</text>
<rect x="0" y="176" width="358" height="56" rx="3" class="s box"/>
<text x="12" y="193">Plan</text>
<rect x="339" y="185" width="7" height="7" class="ink"/>
<text x="12" y="208" class="note">Typed operations on named <tspan font-family="'Geist Mono',ui-monospace,monospace">eIds</tspan>,</text>
<text x="12" y="224" class="note">from a model or a person</text>
<path d="M40 232 L40 254" class="s" marker-end="url(#arrow)"/>
<rect x="0" y="256" width="358" height="216" rx="3" class="em box"/>
<text x="12" y="273" class="em">Six guards, on a copy</text>
<text x="12" y="288" class="note">Operation permitted, <tspan font-family="'Geist Mono',ui-monospace,monospace">eIds</tspan> in scope</text>
<text x="12" y="304" class="note">Passes the lenient schema</text>
<text x="12" y="320" class="note">Finding cleared, no new finding</text>
<text x="12" y="336" class="note">Body text does not shrink</text>
<text x="12" y="352" class="note"><tspan font-family="'Geist Mono',ui-monospace,monospace">meta</tspan> and other text unchanged</text>
<text x="12" y="368" class="note">Written body shares enough words</text>
<text x="12" y="384" class="note">with the page</text>
<path d="M12 396 L346 396" class="s2"/>
<text x="12" y="412" class="micro">If fail: rejected</text>
<text x="12" y="428" class="note">Reasons go back to the model,</text>
<text x="12" y="444" class="note">up to 3 revisions; after 3:</text>
<text x="12" y="460" class="code">revision_budget_exhausted</text>
<path d="M40 472 L40 494" class="s" marker-end="url(#arrow)"/>
<text x="50" y="488" class="note">all pass</text>
<rect x="0" y="496" width="358" height="152" rx="3" class="s box"/>
<text x="12" y="513">Risk</text>
<text x="12" y="528" class="note">Its riskiest operation’s class, raised</text>
<text x="12" y="544" class="note">to high for a body with no page</text>
<text x="12" y="560" class="note">evidence, a changed source, or a</text>
<text x="12" y="576" class="note">rewritten <tspan font-family="'Geist Mono',ui-monospace,monospace">duplicate_number</tspan> body</text>
<path d="M12 588 L346 588" class="s2"/>
<text x="12" y="604" class="micro">If high: queued</text>
<text x="12" y="620" class="code">queued_for_approval</text>
<text x="12" y="636" class="note">Proposal pending; document unchanged</text>
<path d="M40 648 L40 670" class="s" marker-end="url(#arrow)"/>
<text x="50" y="664" class="note">low, medium</text>
<rect x="0" y="672" width="358" height="56" rx="3" class="s box"/>
<text x="12" y="689">Applied</text>
<text x="12" y="704" class="code">cleared</text>
<text x="12" y="720" class="note">The edit stays in the document</text>
</svg>
