<svg xmlns="http://www.w3.org/2000/svg" width="358" height="428" viewBox="0 0 358 428" role="img" aria-label="How Codify reads a PDF, in six stages, with the worked example's path. Dashed stages need the second engine. 1, whole-document engine (Mistral OCR in 25-page chunks): not asked for, ocr_model null; when it reads every page, the read ends there and stages 2 to 5 are skipped. 2, layout pass for regions and a rival read: failed with layout_pass_failed, no second engine. 3, text-layer gate, which keeps a sound layer: 5 of 5 pages diverted as too_short, 0 kept. 4, vision read, one page image per chat-model request: 5 pages read, 965 to 2,704 characters each. 5, backstop, which runs on every page and gives a page with an empty read the rival read: not needed, no empty read. 6, combine, page texts joined in order: source.txt, 10,990 characters. A kept text layer skips stages 4 and 5. Stages 1, 2 and 4 call a model.">
<style>
svg{color:#1d1d1d;font-family:'Geist Sans',ui-sans-serif,system-ui,sans-serif;fill:none;stroke:none}
.s{stroke:currentColor;stroke-width:1.5}.s2{stroke:#6b6b6b;stroke-width:1}.dash{stroke-dasharray:3 3}:not(text).em{stroke:currentColor;stroke-width:2.5}
.box{fill:#fff}.box-lo{fill:#f5f5f5}.ink{fill:currentColor}
text{fill:currentColor;font-size:13px;font-weight:500;letter-spacing:-0.01em}
text.note{fill:#3e3e3e;font-size:12px;font-weight:400;letter-spacing:0}
text.code{fill:#3e3e3e;font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;font-weight:400;letter-spacing:0}
text.micro{fill:#3e3e3e;font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;font-weight:400;letter-spacing:.06em;text-transform:uppercase}
text.em{font-weight:600}
@media (prefers-color-scheme:dark){svg{color:#f3f4ef}.s2{stroke:#a5afa8}.box{fill:#131615}.box-lo{fill:#1c211f}text.note,text.code,text.micro{fill:#c7cdc9}}
</style>
<defs><marker id="arrow" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 8 4.5 1 8" class="s" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="arrow2" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 8 4.5 1 8" class="s2" stroke-linejoin="round" stroke-linecap="round"/></marker></defs>
<text x="0" y="12" class="micro">Stage</text>
<text x="220" y="12" class="micro">This run</text>
<rect x="0" y="28" width="196" height="40" rx="3" class="s2 dash box-lo"/>
<text x="12" y="45">1. Whole-document engine</text>
<text x="12" y="60" class="note">Mistral OCR, 25-page chunks</text>
<rect x="177" y="40" width="7" height="7" class="ink"/>
<text x="220" y="45">not asked for</text>
<text x="220" y="60" class="code">ocr_model: null</text>
<path d="M40 68 L40 90" class="s" marker-end="url(#arrow)"/>
<rect x="0" y="92" width="196" height="40" rx="3" class="s2 dash box-lo"/>
<text x="12" y="109">2. Layout pass</text>
<text x="12" y="124" class="note">regions and a rival read</text>
<rect x="177" y="104" width="7" height="7" class="ink"/>
<text x="220" y="109">failed</text>
<text x="220" y="124" class="code">layout_pass_failed</text>
<path d="M40 132 L40 154" class="s" marker-end="url(#arrow)"/>
<rect x="0" y="156" width="196" height="40" rx="3" class="s box"/>
<text x="12" y="173">3. Text-layer gate</text>
<text x="12" y="188" class="note">a sound layer is kept</text>
<text x="220" y="173">5 of 5 diverted</text>
<text x="220" y="188" class="note">0 kept</text>
<rect x="0" y="220" width="196" height="40" rx="3" class="s box"/>
<text x="12" y="237">4. Vision read</text>
<text x="12" y="252" class="note">one page image per request</text>
<rect x="177" y="232" width="7" height="7" class="ink"/>
<text x="220" y="237">5 pages read</text>
<text x="220" y="252" class="note">965–2,704 characters</text>
<path d="M40 260 L40 282" class="s" marker-end="url(#arrow)"/>
<rect x="0" y="284" width="196" height="40" rx="3" class="s2 dash box-lo"/>
<text x="12" y="301">5. Backstop</text>
<text x="12" y="316" class="note">an empty read takes the rival</text>
<text x="220" y="301">not needed</text>
<text x="220" y="316" class="note">no empty read</text>
<path d="M40 324 L40 346" class="s" marker-end="url(#arrow)"/>
<rect x="0" y="348" width="196" height="40" rx="3" class="s box"/>
<text x="12" y="365">6. Combine</text>
<text x="12" y="380" class="note">page texts joined in order</text>
<text x="220" y="365" class="code">source.txt</text>
<text x="220" y="380" class="note">10,990 characters</text>
<path d="M40 196 L40 218" class="em" marker-end="url(#arrow)"/>
<text x="52" y="209" class="code">too_short</text>
<path d="M196 48 L212 48 L212 376 L198 376" class="s2" marker-end="url(#arrow2)"/>
<text x="206" y="81" class="note" text-anchor="end">all pages read</text>
<path d="M196 176 L204 176 L204 360 L198 360" class="s2" marker-end="url(#arrow2)"/>
<text x="198" y="209" class="note" text-anchor="end">kept</text>
<rect x="0" y="416" width="7" height="7" class="ink"/>
<text x="15" y="423" class="note">calls a model</text>
<rect x="116" y="416" width="20" height="8" rx="3" class="s2 dash box-lo"/>
<text x="144" y="423" class="note">needs the second engine</text>
</svg>
