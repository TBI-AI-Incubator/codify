<svg xmlns="http://www.w3.org/2000/svg" width="358" height="421" viewBox="0 0 358 421" role="img" aria-label="A run in codify serve: an upload to POST /runs/ingest is queued (up to 100; the next gets 429), runs two at once, and finishes as succeeded, failed or cancelled, with the last 200 kept; retry makes a new run. Runs and uploaded files live only in the server process and are lost on restart; the law a run stored stays in PostgreSQL.">
<style>
svg{color:#1d1d1d;font-family:'Geist Sans',ui-sans-serif,system-ui,sans-serif;fill:none;stroke:none}
.s{stroke:currentColor;stroke-width:1.5}.s2{stroke:#6b6b6b;stroke-width:1}.dash{stroke-dasharray:3 3}:not(text).em{stroke:currentColor;stroke-width:2.5}
.box{fill:#fff}.box-lo{fill:#f5f5f5}.ink{fill:currentColor}
text{fill:currentColor;font-size:13px;font-weight:500;letter-spacing:-0.01em}
text.note{fill:#3e3e3e;font-size:12px;font-weight:400;letter-spacing:0}
text.code{fill:#3e3e3e;font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;font-weight:400;letter-spacing:0}
text.micro{fill:#3e3e3e;font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;font-weight:400;letter-spacing:.06em;text-transform:uppercase}
text.em{font-weight:600}
@media (prefers-color-scheme:dark){svg{color:#f3f4ef}.s2{stroke:#a5afa8}.box{fill:#131615}.box-lo{fill:#1c211f}text.note,text.code,text.micro{fill:#c7cdc9}}
</style>
<defs><marker id="arrow" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 8 4.5 1 8" class="s" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="arrow2" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 8 4.5 1 8" class="s2" stroke-linejoin="round" stroke-linecap="round"/></marker></defs>
<rect x="36" y="0" width="200" height="40" rx="3" class="s box"/>
<text x="48" y="17">Upload</text>
<text x="48" y="32" class="code">POST /runs/ingest</text>
<rect x="0" y="64" width="358" height="292" rx="3" class="s2 dash"/>
<text x="346" y="84" class="micro" text-anchor="end">server process · lost on restart</text>
<rect x="36" y="100" width="200" height="56" rx="3" class="s box"/>
<text x="48" y="117">Queued</text>
<text x="48" y="132" class="note">up to 100 waiting</text>
<text x="48" y="148" class="note">the next gets 429</text>
<rect x="36" y="172" width="200" height="40" rx="3" class="s box"/>
<text x="48" y="189">Running</text>
<text x="48" y="204" class="note">2 at once</text>
<rect x="36" y="228" width="200" height="56" rx="3" class="s box"/>
<text x="48" y="245">Finished</text>
<text x="48" y="260" class="note">succeeded, failed, cancelled</text>
<text x="48" y="276" class="note">the last 200 stay readable</text>
<rect x="36" y="300" width="200" height="40" rx="3" class="s2 box-lo"/>
<text x="48" y="317">Uploaded files</text>
<text x="48" y="332" class="code">codify-uploads-…</text>
<path d="M60 40 L60 98" class="s" marker-end="url(#arrow)"/>
<path d="M136 156 L136 170" class="s" marker-end="url(#arrow)"/>
<path d="M136 212 L136 226" class="s" marker-end="url(#arrow)"/>
<path d="M236 256 L252 256 L252 128 L238 128" class="s2" marker-end="url(#arrow2)"/>
<text x="260" y="188" class="note">retry:</text>
<text x="260" y="204" class="note">a new run</text>
<path d="M36 192 L20 192 L20 400 L34 400" class="s" marker-end="url(#arrow)"/>
<text x="28" y="372" class="code">stored</text>
<text x="84" y="372" class="note">writes the law</text>
<rect x="36" y="380" width="200" height="40" rx="3" class="em box"/>
<text x="48" y="397" class="em">PostgreSQL</text>
<text x="48" y="412" class="note">kept across restarts</text>
</svg>
