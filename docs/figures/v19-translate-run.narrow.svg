<svg xmlns="http://www.w3.org/2000/svg" width="358" height="1153" viewBox="0 0 358 1153" role="img" aria-label="A translation run: units walked by eId; a model glossary in which pinned terms replace the model’s entries; model translation in chapter batches with numbers and citations as placeholders; up to 3 model repair passes; a deterministic write and audit; an optional sampled model judge; and a result that a caller grades and turns into per-provision findings.">
<style>
svg{color:#1d1d1d;font-family:'Geist Sans',ui-sans-serif,system-ui,sans-serif;fill:none;stroke:none}
.s{stroke:currentColor;stroke-width:1.5}.s2{stroke:#6b6b6b;stroke-width:1}.dash{stroke-dasharray:3 3}:not(text).em{stroke:currentColor;stroke-width:2.5}
.box{fill:#fff}.box-lo{fill:#f5f5f5}.ink{fill:currentColor}
text{fill:currentColor;font-size:13px;font-weight:500;letter-spacing:-0.01em}
text.note{fill:#3e3e3e;font-size:12px;font-weight:400;letter-spacing:0}
text.code{fill:#3e3e3e;font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;font-weight:400;letter-spacing:0}
text.micro{fill:#3e3e3e;font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;font-weight:400;letter-spacing:.06em;text-transform:uppercase}
text.em{font-weight:600}
@media (prefers-color-scheme:dark){svg{color:#f3f4ef}.s2{stroke:#a5afa8}.box{fill:#131615}.box-lo{fill:#1c211f}text.note,text.code,text.micro{fill:#c7cdc9}}
</style>
<defs><marker id="arrow" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 8 4.5 1 8" class="s" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="arrow2" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 8 4.5 1 8" class="s2" stroke-linejoin="round" stroke-linecap="round"/></marker></defs>
<rect x="259" y="7" width="7" height="7" class="ink"/>
<text x="270" y="14" class="note">calls a model</text>
<rect x="0" y="32" width="358" height="84" rx="3" class="s box"/>
<text x="12" y="49">Units by eId</text>
<text x="12" y="64" class="note">Each element with an <tspan font-family="'Geist Mono',ui-monospace,monospace">eId</tspan> is one unit</text>
<path d="M12 76 L346 76" class="s2"/>
<text x="12" y="92" class="micro">Flags raised</text>
<text x="12" y="108" class="code">translate_skipped_without_eid</text>
<path d="M40 116 L40 138" class="s" marker-end="url(#arrow)"/>
<rect x="0" y="140" width="358" height="116" rx="3" class="s box"/>
<text x="12" y="157">Glossary</text>
<rect x="339" y="149" width="7" height="7" class="ink"/>
<text x="12" y="172" class="note">One call over the whole act; a</text>
<text x="12" y="188" class="note"><tspan font-family="'Geist Mono',ui-monospace,monospace">PinnedTerm</tspan> replaces the model’s entry</text>
<path d="M12 200 L346 200" class="s2"/>
<text x="12" y="216" class="micro">Flags raised</text>
<text x="12" y="232" class="code">notes_partial</text>
<text x="12" y="248" class="code">notes_failed</text>
<path d="M40 256 L40 278" class="s" marker-end="url(#arrow)"/>
<rect x="0" y="280" width="358" height="116" rx="3" class="s box"/>
<text x="12" y="297">Translate</text>
<rect x="339" y="289" width="7" height="7" class="ink"/>
<text x="12" y="312" class="note">Batches of 8 units by chapter; numbers</text>
<text x="12" y="328" class="note">and citations go as placeholders; earlier</text>
<text x="12" y="344" class="note">answers in a chapter go in as examples</text>
<path d="M12 356 L346 356" class="s2"/>
<text x="12" y="372" class="micro">Flags raised</text>
<text x="12" y="388" class="code">translate_sentinel_missing</text>
<path d="M40 396 L40 418" class="s" marker-end="url(#arrow)"/>
<rect x="0" y="420" width="358" height="100" rx="3" class="s box"/>
<text x="12" y="437">Repair</text>
<rect x="339" y="429" width="7" height="7" class="ink"/>
<text x="12" y="452" class="note">A unit with a lost placeholder or an</text>
<text x="12" y="468" class="note">untranslated line goes again, up to 3 times</text>
<path d="M12 480 L346 480" class="s2"/>
<text x="12" y="496" class="micro">Flags raised</text>
<text x="12" y="512" class="code">translate_sentinel_unrepaired</text>
<path d="M40 520 L40 542" class="s" marker-end="url(#arrow)"/>
<rect x="0" y="544" width="358" height="40" rx="3" class="s box"/>
<text x="12" y="561">Write</text>
<text x="12" y="576" class="note">Answers patched onto a copy of the source</text>
<path d="M40 584 L40 606" class="s" marker-end="url(#arrow)"/>
<rect x="0" y="608" width="358" height="228" rx="3" class="em box"/>
<text x="12" y="625" class="em">Deterministic audit</text>
<text x="12" y="640" class="note">Defined terms present in the output</text>
<text x="12" y="656" class="note">Volume against the source</text>
<text x="12" y="672" class="note">Placeholders restored</text>
<text x="12" y="688" class="note">Money amounts neither lost nor doubled</text>
<text x="12" y="704" class="note">Sentences per provision</text>
<text x="12" y="720" class="note">Source script left in the text</text>
<text x="12" y="736" class="note">One drafting voice for obligations</text>
<text x="12" y="752" class="note">Gazette headers, titles, front matter</text>
<path d="M12 764 L346 764" class="s2"/>
<text x="12" y="780" class="micro">Flags raised</text>
<text x="12" y="796" class="code">translate_low_coverage</text>
<text x="12" y="812" class="code">translate_clause_gap</text>
<text x="12" y="828" class="code">register_deontic_mixed</text>
<path d="M40 836 L40 858" class="s" marker-end="url(#arrow)"/>
<rect x="0" y="860" width="358" height="116" rx="3" class="s box dash"/>
<text x="12" y="877">Judge, optional</text>
<rect x="339" y="869" width="7" height="7" class="ink"/>
<text x="12" y="892" class="note">Scores up to 20 sampled provisions; its</text>
<text x="12" y="908" class="note">repairs are counted, not written</text>
<path d="M12 920 L346 920" class="s2"/>
<text x="12" y="936" class="micro">Flags raised</text>
<text x="12" y="952" class="code">judge_fidelity</text>
<text x="12" y="968" class="note">and one code per dimension</text>
<path d="M40 976 L40 998" class="s" marker-end="url(#arrow)"/>
<rect x="0" y="1000" width="358" height="40" rx="3" class="s box"/>
<text x="12" y="1017">TranslationResult</text>
<text x="12" y="1032" class="note"><tspan font-family="'Geist Mono',ui-monospace,monospace">akn_xml</tspan>, <tspan font-family="'Geist Mono',ui-monospace,monospace">notes</tspan>, <tspan font-family="'Geist Mono',ui-monospace,monospace">audit</tspan>, <tspan font-family="'Geist Mono',ui-monospace,monospace">flags</tspan></text>
<path d="M40 1040 L40 1062" class="s" marker-end="url(#arrow)"/>
<rect x="0" y="1064" width="358" height="88" rx="3" class="s box"/>
<text x="12" y="1081" class="code">translation_quality_grade</text>
<text x="12" y="1096" class="note">A, B, C or ungraded, from audit and flags</text>
<text x="12" y="1129" class="code">delivery_findings</text>
<text x="12" y="1144" class="note">Per eId: review or advisory, from audit</text>
</svg>
