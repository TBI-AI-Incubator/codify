<svg xmlns="http://www.w3.org/2000/svg" width="624" height="340" viewBox="0 0 624 340" role="img" aria-label="Identity of the Legislation Act extract before and after set_work_uri">
<style>
svg{color:#1d1d1d;font-family:'Geist Sans',ui-sans-serif,system-ui,sans-serif;fill:none;stroke:none}
.s{stroke:currentColor;stroke-width:1.5}.s2{stroke:#6b6b6b;stroke-width:1}.dash{stroke-dasharray:3 3}:not(text).em{stroke:currentColor;stroke-width:2.5}
.box{fill:#fff}.box-lo{fill:#f5f5f5}.ink{fill:currentColor}
text{fill:currentColor;font-size:13px;font-weight:500;letter-spacing:-0.01em}
text.note{fill:#3e3e3e;font-size:12px;font-weight:400;letter-spacing:0}
text.code{fill:#3e3e3e;font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;font-weight:400;letter-spacing:0}
text.micro{fill:#3e3e3e;font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;font-weight:400;letter-spacing:.06em;text-transform:uppercase}
text.em{font-weight:600}
@media (prefers-color-scheme:dark){svg{color:#f3f4ef}.s2{stroke:#a5afa8}.box{fill:#131615}.box-lo{fill:#1c211f}text.note,text.code,text.micro{fill:#c7cdc9}}
</style>
<defs><marker id="arrow" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 8 4.5 1 8" class="s" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="arrow2" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 8 4.5 1 8" class="s2" stroke-linejoin="round" stroke-linecap="round"/></marker></defs>
<text x="112" y="13">Before</text>
<text x="112" y="29" class="code">legislation-hcontainer.akn.xml</text>
<text x="348" y="13">After set_work_uri</text>
<text x="348" y="29" class="code">legislation-hcontainer.fixed.xml</text>
<path d="M308 9 L334 9" class="s2" marker-end="url(#arrow2)"/>
<path d="M0 44 L624 44" class="s2"/>
<text x="0" y="64" class="micro">Work</text>
<text x="0" y="84" class="code">FRBRthis</text>
<text x="112" y="84" class="code">/akn/xa/act/1992-05-14/7</text>
<text x="348" y="84" class="code">/akn/xa/act/1992/7/!main</text>
<text x="0" y="104" class="code">FRBRuri</text>
<text x="112" y="104" class="code">/akn/xa/act/1992-05-14/7</text>
<text x="348" y="104" class="code em">/akn/xa/act/1992/7</text>
<text x="0" y="124" class="code">FRBRalias</text>
<text x="112" y="124" class="code">Untitled</text>
<text x="348" y="124" class="note">unchanged; edit by hand</text>
<text x="0" y="144" class="code">FRBRdate</text>
<text x="112" y="144" class="code">1992-05-14</text>
<text x="348" y="144" class="note">unchanged</text>
<path d="M0 164 L624 164" class="s2"/>
<text x="0" y="184" class="micro">Expression</text>
<text x="0" y="204" class="code">FRBRthis</text>
<text x="112" y="204" class="code">/akn/xa/act/1992-05-14/7/eng</text>
<text x="348" y="204" class="code">/akn/xa/act/1992/7/eng@1992-05-02</text>
<text x="348" y="220" class="note">no /!main, unlike the work; edit by hand</text>
<text x="0" y="240" class="code">FRBRuri</text>
<text x="112" y="240" class="code">/akn/xa/act/1992-05-14/7/eng</text>
<text x="348" y="240" class="code">/akn/xa/act/1992/7/eng@1992-05-02</text>
<text x="0" y="260" class="code">FRBRdate</text>
<text x="112" y="260" class="code">2026-08-24</text>
<text x="348" y="260" class="code">1992-05-02</text>
<path d="M0 280 L624 280" class="s2"/>
<text x="0" y="300" class="micro">Manifestation</text>
<text x="112" y="300" class="note">FRBRthis, FRBRuri and FRBRdate change exactly as the expression’s do</text>
<path d="M0 312 L624 312" class="s2"/>
<text x="0" y="332" class="note">The schedule's work FRBRthis becomes</text>
<text x="348" y="332" class="code">/akn/xa/act/1992/7/!schedule_1</text>
</svg>
