<svg xmlns="http://www.w3.org/2000/svg" width="358" height="785" viewBox="0 0 358 785" role="img" aria-label="The Codify pipeline, top to bottom: a source PDF is read, its metadata read, anchors found by the jurisdiction config's rules, a scaffold built and filled, parsed to Akoma Ntoso, enriched and validated, then stored and read through the command line, HTTP API, MCP server and web app.">
<style>
svg{color:#1d1d1d;font-family:'Geist Sans',ui-sans-serif,system-ui,sans-serif;fill:none;stroke:none}
.s{stroke:currentColor;stroke-width:1.5}.s2{stroke:#6b6b6b;stroke-width:1}.dash{stroke-dasharray:3 3}:not(text).em{stroke:currentColor;stroke-width:2.5}
.box{fill:#fff}.box-lo{fill:#f5f5f5}.ink{fill:currentColor}
text{fill:currentColor;font-size:13px;font-weight:500;letter-spacing:-0.01em}
text.note{fill:#3e3e3e;font-size:12px;font-weight:400;letter-spacing:0}
text.code{fill:#3e3e3e;font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;font-weight:400;letter-spacing:0}
text.micro{fill:#3e3e3e;font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;font-weight:400;letter-spacing:.06em;text-transform:uppercase}
text.em{font-weight:600}
@media (prefers-color-scheme:dark){svg{color:#f3f4ef}.s2{stroke:#a5afa8}.box{fill:#131615}.box-lo{fill:#1c211f}text.note,text.code,text.micro{fill:#c7cdc9}}
</style>
<defs><marker id="arrow" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 8 4.5 1 8" class="s" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="arrow2" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 8 4.5 1 8" class="s2" stroke-linejoin="round" stroke-linecap="round"/></marker></defs>
<rect x="136" y="0" width="200" height="40" rx="3" class="s box"/>
<text x="148" y="17">Jurisdiction config</text>
<text x="148" y="32" class="code">xa/config.json</text>
<rect x="0" y="7" width="7" height="7" class="ink"/>
<text x="14" y="14" class="note">calls a model</text>
<rect x="136" y="60" width="200" height="40" rx="3" class="s box"/>
<text x="148" y="77">Source PDF</text>
<text x="148" y="92" class="note">5 scanned pages</text>
<path d="M236 100 L236 114" class="s" marker-end="url(#arrow)"/>
<rect x="136" y="116" width="200" height="40" rx="3" class="s box"/>
<text x="148" y="133">Read pages</text>
<text x="148" y="148" class="note">5 pages, one read each</text>
<rect x="317" y="125" width="7" height="7" class="ink"/>
<path d="M236 156 L236 170" class="s" marker-end="url(#arrow)"/>
<rect x="136" y="172" width="200" height="40" rx="3" class="s box"/>
<text x="148" y="189">Read metadata</text>
<text x="148" y="204" class="note">1 call: title, date, number</text>
<rect x="317" y="181" width="7" height="7" class="ink"/>
<path d="M236 212 L236 226" class="s" marker-end="url(#arrow)"/>
<rect x="136" y="228" width="200" height="40" rx="3" class="s box"/>
<text x="148" y="245">Find anchors</text>
<text x="148" y="260" class="note">26 found by the rules</text>
<path d="M236 268 L236 282" class="s" marker-end="url(#arrow)"/>
<rect x="136" y="284" width="200" height="40" rx="3" class="s box"/>
<text x="148" y="301">Build scaffold</text>
<text x="148" y="316" class="note">26 headings, bodies empty</text>
<path d="M236 324 L236 338" class="s" marker-end="url(#arrow)"/>
<rect x="136" y="340" width="200" height="40" rx="3" class="s box"/>
<text x="148" y="357">Fill text</text>
<text x="148" y="372" class="note">3 windows, one call each</text>
<rect x="317" y="349" width="7" height="7" class="ink"/>
<path d="M236 380 L236 394" class="s" marker-end="url(#arrow)"/>
<rect x="136" y="396" width="200" height="40" rx="3" class="s box"/>
<text x="148" y="413">Parse</text>
<text x="148" y="428" class="note">Bluebell to Akoma Ntoso</text>
<path d="M236 436 L236 450" class="s" marker-end="url(#arrow)"/>
<rect x="136" y="452" width="200" height="40" rx="3" class="s box"/>
<text x="148" y="469">Enrich</text>
<text x="148" y="484" class="note">11 passes, one with a model</text>
<rect x="317" y="461" width="7" height="7" class="ink"/>
<path d="M236 492 L236 506" class="s" marker-end="url(#arrow)"/>
<rect x="136" y="508" width="200" height="40" rx="3" class="s box"/>
<text x="148" y="525">Validate</text>
<text x="148" y="540" class="note">1 finding, grade warning</text>
<path d="M236 548 L236 562" class="s" marker-end="url(#arrow)"/>
<rect x="136" y="564" width="200" height="40" rx="3" class="em box"/>
<text x="148" y="581" class="em">Akoma Ntoso XML</text>
<text x="148" y="596" class="code">/akn/xa/act/1992/7</text>
<path d="M236 604 L236 618" class="s" marker-end="url(#arrow)"/>
<rect x="136" y="620" width="200" height="40" rx="3" class="s box"/>
<text x="148" y="637">Store</text>
<text x="148" y="652" class="note">PostgreSQL, by codify load</text>
<path d="M136 20 L120 20 L120 472" class="s2"/>
<path d="M120 136 L134 136" class="s2" marker-end="url(#arrow2)"/>
<path d="M120 192 L134 192" class="s2" marker-end="url(#arrow2)"/>
<path d="M120 248 L134 248" class="s2" marker-end="url(#arrow2)"/>
<path d="M120 304 L134 304" class="s2" marker-end="url(#arrow2)"/>
<path d="M120 360 L134 360" class="s2" marker-end="url(#arrow2)"/>
<path d="M120 416 L134 416" class="s2" marker-end="url(#arrow2)"/>
<path d="M120 472 L134 472" class="s2" marker-end="url(#arrow2)"/>
<rect x="0" y="60" width="108" height="40" rx="3" class="s box"/>
<text x="10" y="77">Publisher XML</text>
<text x="10" y="92" class="note">no model</text>
<path d="M54 100 L54 528 L134 528" class="s" marker-end="url(#arrow)"/>
<path d="M236 660 L236 674" class="s" marker-end="url(#arrow)"/>
<rect x="0" y="676" width="358" height="108" rx="3" class="s box"/>
<text x="12" y="696" class="micro">Read through</text>
<text x="12" y="718">Command line</text>
<text x="12" y="734" class="code">codify</text>
<text x="191" y="718">HTTP API</text>
<text x="191" y="734" class="code">codify serve</text>
<text x="12" y="758">MCP server</text>
<text x="12" y="774" class="code">codify mcp</text>
<text x="191" y="758">Web app</text>
<text x="191" y="774" class="code">apps/web</text>
</svg>
