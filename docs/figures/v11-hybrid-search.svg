<svg xmlns="http://www.w3.org/2000/svg" width="624" height="405" viewBox="0 0 624 405" role="img" aria-label="Hybrid search, top to bottom: a query passes the scope (one jurisdiction, the current version of each law, normative provisions only) into two arms. The lexical arm ranks provisions by BM25 on the query’s words; the dense arm, which calls a model to embed the query, ranks them by nearness of embeddings. Each passes on up to 30, ranked. Reciprocal rank fusion scores each provision 1 / (60 + lexical rank) + 1 / (60 + dense rank), with no term from an arm that did not find it, and matches come out best first with eid, score and text.">
<style>
svg{color:#1d1d1d;font-family:'Geist Sans',ui-sans-serif,system-ui,sans-serif;fill:none;stroke:none}
.s{stroke:currentColor;stroke-width:1.5}.s2{stroke:#6b6b6b;stroke-width:1}.dash{stroke-dasharray:3 3}:not(text).em{stroke:currentColor;stroke-width:2.5}
.box{fill:#fff}.box-lo{fill:#f5f5f5}.ink{fill:currentColor}
text{fill:currentColor;font-size:13px;font-weight:500;letter-spacing:-0.01em}
text.note{fill:#3e3e3e;font-size:12px;font-weight:400;letter-spacing:0}
text.code{fill:#3e3e3e;font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;font-weight:400;letter-spacing:0}
text.micro{fill:#3e3e3e;font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;font-weight:400;letter-spacing:.06em;text-transform:uppercase}
text.em{font-weight:600}
@media (prefers-color-scheme:dark){svg{color:#f3f4ef}.s2{stroke:#a5afa8}.box{fill:#131615}.box-lo{fill:#1c211f}text.note,text.code,text.micro{fill:#c7cdc9}}
</style>
<defs><marker id="arrow" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 8 4.5 1 8" class="s" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="arrow2" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 8 4.5 1 8" class="s2" stroke-linejoin="round" stroke-linecap="round"/></marker></defs>
<rect x="0" y="7" width="7" height="7" class="ink"/>
<text x="14" y="14" class="note">calls a model</text>
<rect x="0" y="32" width="624" height="40" rx="3" class="s box"/>
<text x="12" y="49">Query</text>
<text x="12" y="64" class="code">"right of access to the official text"</text>
<path d="M312 72 L312 86" class="s" marker-end="url(#arrow)"/>
<rect x="0" y="88" width="624" height="40" rx="3" class="s box-lo"/>
<text x="12" y="105">Scope, applied inside each arm</text>
<text x="12" y="120" class="note">One jurisdiction, the current version of each law, normative provisions only</text>
<path d="M152 128 L152 150" class="s" marker-end="url(#arrow)"/>
<rect x="0" y="152" width="304" height="88" rx="3" class="s box"/>
<text x="12" y="169">Lexical arm</text>
<text x="12" y="184" class="note">BM25 on the query’s words; rare words</text>
<text x="12" y="200" class="note">weigh more than common ones</text>
<text x="12" y="224" class="note">Up to 30 best, ranked</text>
<path d="M152 240 L152 262" class="s" marker-end="url(#arrow)"/>
<path d="M472 128 L472 150" class="s" marker-end="url(#arrow)"/>
<rect x="320" y="152" width="304" height="88" rx="3" class="s box"/>
<text x="332" y="169">Dense arm</text>
<rect x="605" y="161" width="7" height="7" class="ink"/>
<text x="332" y="184" class="note">An embedding of the query against</text>
<text x="332" y="200" class="note">each provision’s embedding</text>
<text x="332" y="224" class="note">Up to 30 nearest, ranked</text>
<path d="M472 240 L472 262" class="s" marker-end="url(#arrow)"/>
<rect x="0" y="264" width="624" height="84" rx="3" class="em box"/>
<text x="12" y="281" class="em">Reciprocal rank fusion</text>
<text x="12" y="296" class="note">Each provision scores</text>
<text x="12" y="316" class="code">1 / (60 + lexical rank) + 1 / (60 + dense rank)</text>
<text x="12" y="336" class="note">An arm that did not find it adds nothing.</text>
<path d="M312 348 L312 362" class="s" marker-end="url(#arrow)"/>
<rect x="0" y="364" width="624" height="40" rx="3" class="s box"/>
<text x="12" y="381">Matches, best first</text>
<text x="12" y="396" class="code">eid, score, text</text>
</svg>
