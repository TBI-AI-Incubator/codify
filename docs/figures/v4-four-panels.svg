<svg xmlns="http://www.w3.org/2000/svg" width="624" height="701" viewBox="0 0 624 701" role="img" aria-label="Section 1 of the worked example, Short title and commencement, in four bundle files. In source.txt, line 17 is the marginal note Short title and commencement, line 18 the number 1 alone, and line 19 begins (1) This Act may be cited as the Legislation Act, 1992. Find anchors, by rule from the config, records it as line 2 of anchors.jsonl: kind section, keyword Short title and commencement, number 1, char_offset 959, line 17, parent_eid part_I, akn_eid part_I__sec_1, source_pass marginal_note_units; the eId is set here. Build scaffold writes a header line per anchor with no body text, and keeps the eId in memory beside each header rather than in the file: scaffold.bluebell lines 11 to 15 read PART I - PRELIMINARY, SECTION 1 - Short title and commencement and SECTION 2 - Interpretation, with blank lines where the bodies go; a note on the SECTION 1 line reads part_I__sec_1, held in memory with this header, not in the file. Fill text calls a model, which returns the lines for each eId, and the parse gives final.akn.xml from line 47: a section with eId part_I__sec_1, num 1, heading Short title and commencement, and a point with eId part_I__sec_1__point_1, num (1), whose paragraph part_I__sec_1__point_1__p_1 holds the text the model filled: This Act may be cited as the Legislation Act, 1992.">
<style>
svg{color:#1d1d1d;font-family:'Geist Sans',ui-sans-serif,system-ui,sans-serif;fill:none;stroke:none}
.s{stroke:currentColor;stroke-width:1.5}.s2{stroke:#6b6b6b;stroke-width:1}.dash{stroke-dasharray:3 3}:not(text).em{stroke:currentColor;stroke-width:2.5}
.box{fill:#fff}.box-lo{fill:#f5f5f5}.ink{fill:currentColor}
text{fill:currentColor;font-size:13px;font-weight:500;letter-spacing:-0.01em}
text.note{fill:#3e3e3e;font-size:12px;font-weight:400;letter-spacing:0}
text.code{fill:#3e3e3e;font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;font-weight:400;letter-spacing:0}
text.micro{fill:#3e3e3e;font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;font-weight:400;letter-spacing:.06em;text-transform:uppercase}
text.em{font-weight:600}
@media (prefers-color-scheme:dark){svg{color:#f3f4ef}.s2{stroke:#a5afa8}.box{fill:#131615}.box-lo{fill:#1c211f}text.note,text.code,text.micro{fill:#c7cdc9}}
</style>
<defs><marker id="arrow" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 8 4.5 1 8" class="s" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="arrow2" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 8 4.5 1 8" class="s2" stroke-linejoin="round" stroke-linecap="round"/></marker></defs>
<style>.marker{fill:#fff;stroke:currentColor;stroke-width:1}text.marker-n{font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;font-weight:500;text-anchor:middle;dominant-baseline:central}@media (prefers-color-scheme:dark){.marker{fill:#131615}}</style>
<rect x="0" y="7" width="7" height="7" class="ink"/>
<text x="14" y="14" class="note">calls a model</text>
<rect x="0" y="28" width="624" height="92" rx="3" class="s box"/>
<text x="12" y="49" class="code">source.txt</text>
<text x="612" y="49" class="note" text-anchor="end">lines 17–19</text>
<path d="M0 60 L624 60" class="s2"/>
<text x="12" y="80" class="note">17</text>
<text x="36" y="80" class="code">Short title and commencement</text>
<text x="12" y="96" class="note">18</text>
<text x="36" y="96" class="code">1.</text>
<text x="12" y="112" class="note">19</text>
<text x="36" y="112" class="code">(1) This Act may be cited as the Legislation Act, 1992.</text>
<path d="M16 120 L16 158" class="s" marker-end="url(#arrow)"/>
<text x="32" y="137">Find anchors</text>
<text x="32" y="152" class="note">by rule, from the config; the eId is set here</text>
<rect x="0" y="160" width="624" height="108" rx="3" class="s box"/>
<text x="12" y="181" class="code">anchors.jsonl</text>
<text x="612" y="181" class="note" text-anchor="end">line 2</text>
<path d="M0 192 L624 192" class="s2"/>
<text x="12" y="212" class="code">{"kind": "section", "keyword": "Short title and commencement",</text>
<text x="19.2" y="228" class="code">"number": "1", "char_offset": 959, "line": 17, ...,</text>
<text x="19.2" y="244" class="code">"parent_eid": "part_I", "akn_eid": "<tspan font-weight="600" fill="currentColor">part_I__sec_1</tspan>", ...,</text>
<text x="19.2" y="260" class="code">"source_pass": "marginal_note_units"}</text>
<path d="M16 268 L16 306" class="s" marker-end="url(#arrow)"/>
<text x="32" y="285">Build scaffold</text>
<text x="32" y="300" class="note">a header per anchor, no body; the eId stays in memory</text>
<rect x="0" y="308" width="624" height="164" rx="3" class="s box"/>
<text x="12" y="329" class="code">scaffold.bluebell</text>
<text x="612" y="329" class="note" text-anchor="end">lines 11–15</text>
<path d="M0 340 L624 340" class="s2"/>
<text x="26.4" y="360" class="code">PART I - PRELIMINARY</text>
<text x="40.8" y="392" class="code">SECTION 1 - Short title and commencement</text>
<text x="40.8" y="424" class="code">SECTION 2 - Interpretation</text>
<path d="M20 396 L20 444 L30 444" class="s2 dash"/>
<circle cx="20" cy="388" r="8" class="marker"/>
<text x="20" y="388" class="marker-n" text-anchor="middle">1</text>
<text x="36" y="448" class="code">"<tspan font-weight="600" fill="currentColor">part_I__sec_1</tspan>"</text>
<text x="36" y="464" class="note">held in memory with this header, not in the file</text>
<path d="M16 472 L16 510" class="s" marker-end="url(#arrow)"/>
<rect x="32" y="481" width="7" height="7" class="ink"/>
<text x="46" y="489">Fill text, then parse</text>
<text x="46" y="504" class="note">the model returns the lines for each eId</text>
<rect x="0" y="512" width="624" height="188" rx="3" class="s box"/>
<text x="12" y="533" class="code">final.akn.xml</text>
<text x="612" y="533" class="note" text-anchor="end">from line 47</text>
<path d="M0 544 L624 544" class="s2"/>
<text x="12" y="564" class="code">&lt;section eId="<tspan font-weight="600" fill="currentColor">part_I__sec_1</tspan>"&gt;</text>
<text x="26.4" y="580" class="code">&lt;num&gt;1&lt;/num&gt;</text>
<text x="26.4" y="596" class="code">&lt;heading&gt;Short title and commencement&lt;/heading&gt;</text>
<text x="26.4" y="612" class="code">&lt;point eId="part_I__sec_1__point_1"&gt;</text>
<text x="40.8" y="628" class="code">&lt;num&gt;(1)&lt;/num&gt;</text>
<text x="40.8" y="644" class="code">&lt;content&gt;</text>
<text x="55.2" y="660" class="code">&lt;p eId="part_I__sec_1__point_1__p_1"&gt;</text>
<text x="69.6" y="676" class="code">This Act may be cited as the Legislation Act, 1992.&lt;/p&gt;</text>
<text x="26.4" y="692" class="code">...</text>
</svg>
