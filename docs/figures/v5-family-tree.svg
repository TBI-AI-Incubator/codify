<svg xmlns="http://www.w3.org/2000/svg" width="624" height="352" viewBox="0 0 624 352" role="img" aria-label="One work, /akn/xa/act/1992/7, with three expressions: English as enacted on 1992-05-02, English as amended from 2012-01-01 (current), and a French translation of the 2012 text, each with its file.">
<style>
svg{color:#1d1d1d;font-family:'Geist Sans',ui-sans-serif,system-ui,sans-serif;fill:none;stroke:none}
.s{stroke:currentColor;stroke-width:1.5}.s2{stroke:#6b6b6b;stroke-width:1}.dash{stroke-dasharray:3 3}:not(text).em{stroke:currentColor;stroke-width:2.5}
.box{fill:#fff}.box-lo{fill:#f5f5f5}.ink{fill:currentColor}
text{fill:currentColor;font-size:13px;font-weight:500;letter-spacing:-0.01em}
text.note{fill:#3e3e3e;font-size:12px;font-weight:400;letter-spacing:0}
text.code{fill:#3e3e3e;font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;font-weight:400;letter-spacing:0}
text.micro{fill:#3e3e3e;font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;font-weight:400;letter-spacing:.06em;text-transform:uppercase}
text.em{font-weight:600}
@media (prefers-color-scheme:dark){svg{color:#f3f4ef}.s2{stroke:#a5afa8}.box{fill:#131615}.box-lo{fill:#1c211f}text.note,text.code,text.micro{fill:#c7cdc9}}
</style>
<defs><marker id="arrow" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 8 4.5 1 8" class="s" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="arrow2" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 8 4.5 1 8" class="s2" stroke-linejoin="round" stroke-linecap="round"/></marker></defs>
<text x="0" y="28" class="micro">Work</text>
<rect x="72" y="4" width="548" height="40" rx="3" class="s box"/>
<text x="84" y="21" class="code">/akn/xa/act/1992/7</text>
<text x="84" y="37" class="note">Legislation Act, 1992: one URI for its whole life</text>
<text x="0" y="76" class="micro">Date</text>
<path d="M72 72 L620 72" class="s2" marker-end="url(#arrow2)"/>
<path d="M96 44 L96 94" class="s2"/>
<text x="104" y="64" class="code">1992-05-02</text>
<path d="M380 44 L380 94" class="s2"/>
<text x="388" y="64" class="code">2012-01-01</text>
<text x="0" y="124" class="micro">English</text>
<rect x="72" y="96" width="264" height="84" rx="3" class="box"/>
<rect x="72" y="152" width="264" height="28" class="box-lo"/>
<path d="M72 152 L336 152" class="s2"/>
<rect x="72" y="96" width="264" height="84" rx="3" class="s"/>
<text x="84" y="113" class="code">/eng@1992-05-02</text>
<text x="84" y="129" class="note">As enacted</text>
<text x="84" y="145" class="note">URI fixed, still citable</text>
<text x="84" y="171" class="code">final.akn.xml</text>
<rect x="356" y="96" width="264" height="84" rx="3" class="box"/>
<rect x="356" y="152" width="264" height="28" class="box-lo"/>
<path d="M356 152 L620 152" class="s2"/>
<rect x="356" y="96" width="264" height="84" rx="3" class="em"/>
<text x="368" y="113" class="code em">/eng@2012-01-01</text>
<text x="368" y="129" class="note">Current text</text>
<text x="368" y="145" class="note">Amended by <tspan class="code">/akn/xa/act/2011/5</tspan></text>
<text x="368" y="171" class="code">consolidated-2012.akn.xml</text>
<text x="0" y="244" class="micro">French</text>
<path d="M380 180 L380 214" class="s2" marker-end="url(#arrow2)"/>
<text x="388" y="202" class="note">same work, translated from it</text>
<rect x="356" y="216" width="264" height="84" rx="3" class="box"/>
<rect x="356" y="272" width="264" height="28" class="box-lo"/>
<path d="M356 272 L620 272" class="s2"/>
<rect x="356" y="216" width="264" height="84" rx="3" class="s"/>
<text x="368" y="233" class="code">/fra@2012-01-01</text>
<text x="368" y="249" class="note">Translation, not authoritative</text>
<text x="368" y="265" class="note">Never current</text>
<text x="368" y="291" class="code">translated-fra.akn.xml</text>
<text x="72" y="328" class="note">Each box is one expression: one text, in one language, from one date.</text>
<text x="72" y="344" class="note">Shaded strip: its file, a manifestation.</text>
</svg>
