<svg xmlns="http://www.w3.org/2000/svg" width="358" height="909" viewBox="0 0 358 909" role="img" aria-label="The open-core line. Inside, the Codify core (under the Apache License 2.0; the Python package is codify-core on PyPI): available as commands and apps are reading, structuring and validating a PDF (codify ingest-one), validation and the quality grade in every bundle, bulk publisher indexes (codify index-* and crawl-ocs), storage in PostgreSQL (codify load), hybrid search (codify search), directive-to-law comparison (codify compare), the read API (codify serve), the MCP server for agents (codify mcp), the web app (apps/web, run from a source checkout, not in the PyPI package) and the jurisdiction configs flagged synthetic or public_reference; library only are the repair agent (codify.repair), acquisition adapters (codify.acquisition), translation (codify.translate) and the lens interface (codify.lenses). The core calls your own OpenAI-compatible model endpoint to read scans, structure, compare, embed and translate. Your lens, a package with an entry point in codify.lenses, plugs in through an opening in the line beside the lens interface. Not in the core: the commercial lens detectors and their catalogues, customer corpora and real documents, other jurisdiction configs, sign-in, roles, tenancy and an audit trail, durable job orchestration, and hosting, backup, upgrade and support.">
