<svg xmlns="http://www.w3.org/2000/svg" width="624" height="309" viewBox="0 0 624 309" role="img" aria-label="A run in codify serve: an upload to POST /runs/ingest is queued (up to 100; the next gets 429), runs two at once, and finishes as succeeded, failed or cancelled, with the last 200 kept; retry makes a new run. Runs and uploaded files live only in the server process and are lost on restart; the law a run stored stays in PostgreSQL.">
<style>
svg{color:#1d1d1d;font-family:'Geist Sans',ui-sans-serif,system-ui,sans-serif;fill:none;stroke:none}
.s{stroke:currentColor;stroke-width:1.5}.s2{stroke:#6b6b6b;stroke-width:1}.dash{stroke-dasharray:3 3}:not(text).em{stroke:currentColor;stroke-width:2.5}
.box{fill:#fff}.box-lo{fill:#f5f5f5}.ink{fill:currentColor}
text{fill:currentColor;font-size:13px;font-weight:500;letter-spacing:-0.01em}
text.note{fill:#3e3e3e;font-size:12px;font-weight:400;letter-spacing:0}
text.code{fill:#3e3e3e;font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;font-weight:400;letter-spacing:0}
text.micro{fill:#3e3e3e;font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;font-weight:400;letter-spacing:.06em;text-transform:uppercase}
text.em{font-weight:600}
@media (prefers-color-scheme:dark){svg{color:#f3f4ef}.s2{stroke:#a5afa8}.box{fill:#131615}.box-lo{fill:#1c211f}text.note,text.code,text.micro{fill:#c7cdc9}}
</style>
<defs><marker id="arrow" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 8 4.5 1 8" class="s" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="arrow2" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 8 4.5 1 8" class="s2" stroke-linejoin="round" stroke-linecap="round"/></marker></defs>
<rect x="12" y="0" width="160" height="40" rx="3" class="s box"/>
<text x="24" y="17">Upload</text>
<text x="24" y="32" class="code">POST /runs/ingest</text>
<rect x="0" y="64" width="624" height="180" rx="3" class="s2 dash"/>
<text x="612" y="84" class="micro" text-anchor="end">server process · lost on restart</text>
<rect x="12" y="116" width="160" height="56" rx="3" class="s box"/>
<text x="24" y="133">Queued</text>
<text x="24" y="148" class="note">up to 100 waiting</text>
<text x="24" y="164" class="note">the next gets 429</text>
<rect x="188" y="116" width="160" height="56" rx="3" class="s box"/>
<text x="200" y="133">Running</text>
<text x="200" y="148" class="note">2 at once</text>
<rect x="364" y="116" width="244" height="56" rx="3" class="s box"/>
<text x="376" y="133">Finished</text>
<text x="376" y="148" class="note">succeeded, failed, cancelled</text>
<text x="376" y="164" class="note">the last 200 stay readable</text>
<rect x="364" y="188" width="244" height="40" rx="3" class="s2 box-lo"/>
<text x="376" y="205">Uploaded files</text>
<text x="376" y="220" class="code">codify-uploads-…</text>
<path d="M40 40 L40 114" class="s" marker-end="url(#arrow)"/>
<path d="M172 144 L186 144" class="s" marker-end="url(#arrow)"/>
<path d="M348 144 L362 144" class="s" marker-end="url(#arrow)"/>
<path d="M486 116 L486 104 L92 104 L92 114" class="s2" marker-end="url(#arrow2)"/>
<text x="200" y="96" class="note">retry: a new run</text>
<path d="M268 172 L268 266" class="s" marker-end="url(#arrow)"/>
<text x="276" y="200" class="code">stored</text>
<text x="276" y="216" class="note">writes the law</text>
<rect x="188" y="268" width="160" height="40" rx="3" class="em box"/>
<text x="200" y="285" class="em">PostgreSQL</text>
<text x="200" y="300" class="note">kept across restarts</text>
</svg>
