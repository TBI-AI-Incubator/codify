# Core corpus-schema migrations. Runs on its own version table
# (`alembic_version_core`), independent of the product chain in apps/api.
# A self-hosting deployment runs: alembic -c packages/codify/alembic.ini upgrade head

[alembic]
script_location = %(here)s/codify/migrations
prepend_sys_path = .
path_separator = os

# sqlalchemy.url is read from POSTGRES_URL by codify/migrations/env.py.
# Do not set it here.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
