[project]
name = "codify-core"
version = "0.3.0"
description = "Core legal-AI library — AKN parsing, embedding, retrieval, comparison"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.md", "licenses/*.txt"]
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.13.4",
  "pydantic-settings>=2.13",
  "httpx>=0.28",
  "certifi>=2026.4",
  "lxml>=6.1.1",
  # `regex`, not stdlib `re`: the repair agent needs a matching deadline.
  "regex>=2026.5.9",
  "cobalt>=9.0",
  "bluebell-akn>=3.1",
  "python-dotenv>=1.2",
  "langfuse>=4.0",
  "pypdf>=6.16.1",
  "Pillow>=12.3.0",
  "tenacity>=9.1",
  "pdf2image>=1.17.0",
  "google-genai>=1.70.0,<2",
  "openai>=2.30.0,<3",
  "pydantic-ai-slim[openai]>=1.107.0,<2",
  "beautifulsoup4>=4.15.0",
  "hijridate>=2.6.0",
  "convertdate>=2.4.0",
  "asyncpg>=0.31.0",
  "sqlalchemy[asyncio]>=2.0",
  "sqlmodel>=0.0.22",
  "pgvector>=0.3.6",
  # Snowball stemmers for the lexical search arm. Carries 36 algorithms
  # against the 28 Postgres 18 compiles in, Polish among them.
  "PyStemmer>=3.1",
  # Security floor: CVE-2026-69247 is only fixed in 50.0.0.
  "cryptography>=50.0.0",
  "structlog>=26.1.0",
  "pyyaml>=6.0",
  "shapely>=2.0",
]

[project.optional-dependencies]
# Running the core migration chain standalone (alembic.ini at the root).
# A hosting service brings its own; a core-only install needs the extra.
migrations = ["alembic>=1.14", "psycopg[binary]>=3.3.4"]

[project.scripts]
codify = "codify.cli:main"

[dependency-groups]
# The open repository is this package alone, so its tests declare what they need
# rather than inheriting the monorepo root's group.
dev = [
  "hatchling>=1.27",
    "hypothesis>=6.100",
    "pytest>=9.0",
    "pytest-asyncio>=1.4.0",
    "pytest-xdist>=3.6",
    "psycopg[binary]>=3.3.4",
    "numpy>=2.0",
    "alembic>=1.14",
]

[tool.pytest.ini_options]
markers = [
    "integration: requires external services (Postgres, MinIO, etc.)",
    "live_llm: requires a reachable LLM (Ollama or remote provider)",
]
asyncio_mode = "auto"
# Run from this directory, as the open repository does, and the scripts are
# importable by name the way the monorepo root makes them.
pythonpath = ["scripts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["codify"]
include = [
  "codify/**/seeds/*.yaml",
  "codify/translate/pins/*.jsonl",
  "codify/migrations/versions/*.sql",
  "codify/contract/*.txt",
]

# The shipping subset of data/ is selected by the configs' own flags at build
# time; see hatch_build.py. Listing paths here instead would need an edit every
# time a flag moved, and the two would disagree in silence.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

# The sdist carries the same selection, so a wheel built from the published
# source finds it. Without this the sdist builds a wheel with no data.
[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"
