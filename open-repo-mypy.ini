; mypy for the open repository; out of pyproject.toml as the ruff config is.
[mypy]
python_version = 3.12
strict = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
disallow_any_generics = True
no_implicit_reexport = True
exclude = (dist/|build/|\.venv/)

[mypy-cobalt.*,bluebell.*,pdf2image.*,pgvector.*,lxml.*,Stemmer]
ignore_missing_imports = True

; SQLModel + sa_column=Column(...) drops column-descriptor types under strict.
[mypy-codify.storage.*]
disable_error_code = arg-type, attr-defined, call-arg, call-overload, union-attr
